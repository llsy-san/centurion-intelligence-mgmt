version: '3.8'

services:
  task-scheduler-service:
    build: .
    ports:
      - "8004:8004"
    environment:
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__USERNAME=postgres
      - DATABASE__PASSWORD=password
      - DATABASE__DATABASE=centurion_intelligence_db
      - REDIS__HOST=redis
      - REDIS__PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ../shared:/app/shared:ro
    networks:
      - centurion-intelligence-network

  # Celery Worker
  celery-worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --queues=sync_queue,analysis_queue,default
    environment:
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__USERNAME=postgres
      - DATABASE__PASSWORD=password
      - DATABASE__DATABASE=centurion_intelligence_db
      - REDIS__HOST=redis
      - REDIS__PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ../shared:/app/shared:ro
    networks:
      - centurion-intelligence-network

  # Celery Beat (定时任务调度器)
  celery-beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__USERNAME=postgres
      - DATABASE__PASSWORD=password
      - DATABASE__DATABASE=centurion_intelligence_db
      - REDIS__HOST=redis
      - REDIS__PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ../shared:/app/shared:ro
    networks:
      - centurion-intelligence-network

  # Flower (任务监控界面)
  flower:
    build: .
    command: celery -A celery_app flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    environment:
      - DATABASE__HOST=postgres
      - DATABASE__PORT=5432
      - DATABASE__USERNAME=postgres
      - DATABASE__PASSWORD=password
      - DATABASE__DATABASE=centurion_intelligence_db
      - REDIS__HOST=redis
      - REDIS__PORT=6379
    depends_on:
      - redis
    volumes:
      - ../shared:/app/shared:ro
    networks:
      - centurion-intelligence-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: centurion_intelligence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - centurion-intelligence-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - centurion-intelligence-network

volumes:
  postgres_data:

networks:
  centurion-intelligence-network:
    driver: bridge