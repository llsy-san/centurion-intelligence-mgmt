version: '3.8'

# 百夫长智能管理系统

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    container_name: centurion-postgres
    environment:
      POSTGRES_DB: centurion_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: centurion123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-compose/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - centurion-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: centurion-redis
    command: redis-server --requirepass centurion123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - centurion-network

  # MinIO 文件存储
  minio:
    image: minio/minio:latest
    container_name: centurion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - centurion-network

  # API 网关
  api-gateway:
    build: ./api-gateway
    container_name: centurion-api-gateway
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:centurion123@postgres:5432/centurion_db
      - REDIS_URL=redis://:centurion123@redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - centurion-network

  # 订单服务
  order-service:
    build: ./order-service
    container_name: centurion-order-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://postgres:centurion123@postgres:5432/centurion_db
      - REDIS_URL=redis://:centurion123@redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - centurion-network

  # 支付服务
  payment-service:
    build: ./payment-service
    container_name: centurion-payment-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:centurion123@postgres:5432/centurion_db
      - REDIS_URL=redis://:centurion123@redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - centurion-network

  # 物流服务
  shipping-service:
    build: ./shipping-service
    container_name: centurion-shipping-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://postgres:centurion123@postgres:5432/centurion_db
      - REDIS_URL=redis://:centurion123@redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - centurion-network

  # AI 智能体服务
  ai-agent-service:
    build: ./ai-agent-service
    container_name: centurion-ai-agent-service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://postgres:centurion123@postgres:5432/centurion_db
      - REDIS_URL=redis://:centurion123@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-api-key}
    depends_on:
      - postgres
      - redis
    networks:
      - centurion-network

  # 任务调度服务
  task-scheduler-service:
    build: ./task-scheduler-service
    container_name: centurion-task-scheduler-service
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://postgres:centurion123@postgres:5432/centurion_db
      - REDIS_URL=redis://:centurion123@redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - centurion-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  centurion-network:
    driver: bridge